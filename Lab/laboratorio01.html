
<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="O portal d IF Fluminense é o local de acesso de tods os alunos a informações do campus.">
    <title>Portal do IFF</title>
</head>
<body>
    <header>
        <h1>Área de Contato do Cliente</h1>
          <nav id = "menu">
            <a href="#">Ajuda</a> | <a href="#">Sair</a>
          </nav>
   </header>

    <main>
        <section>
           <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
        
               <form action="/enviar" method="POST">

                  <article>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required minlength="3">
                  </article>

                  <article>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required minlength="5">
                  </article>

                  <article>
                    <label for="celular">Telefone Celular:</label>
                    <input type="tel" id="celular" name="celular"
                        minlength="11"                   
                        maxlength="11" 
                        required pattern="[0-9]{11}"
                        inputmode= "numeric"   
                        title="O celular deve conter exatamente 11 números, sem espaços ou traços (Ex: 11999999999)">
                  </article>

                  <article>
                    <label for="msg">Mensagem:</label>
                    <textarea id="msg" name="msg" rows="4" required></textarea>
                  </article>
              <button type="submit">Disparar Dados</button>
          </form>
        </section>
    </main>

    <footer>
        <p>Suporte Tech 2026<p>
    </footer>
</body>
</html>
