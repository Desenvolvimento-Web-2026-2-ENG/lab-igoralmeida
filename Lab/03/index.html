<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Horária de Aulas do Módulo</title>
</head>
<body>

    <main>
        <section class="bloco-cronograma">
            <h2 class="titulo-seccao">Horários acadêmicos</h2>
            <table border="1">
                <caption>Grade de horários das disciplinas do módulo</caption>
                <thead>
                    <tr>
                        <th scope="col">Aula</th>
                        <th scope="col">Horário</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Estruturação Multimídia</td>
                        <td>19:00 - 20:30</td>
                    </tr>
                </tbody>
            </table>
            
            <p>Recursos necessários:</p>
            <ul>
                <li>Computador com IDE configurada</li>
                <li>Arquivos de legenda (.vtt) prontos</li>
            </ul>
        </section>

        <hr>
        
        <section class="bloco-video">
            <h2>Apresentação da Disciplina</h2>
            <video controls>
                <source src="https://dl6.webmfiles.org/big-buck-bunny_trailer.webm" type="video/webm">
                <track kind="captions" src="legendas-aula.vtt" srclang="pt" label="Português" default>
                Seu navegador não suporta a execução de vídeos.
            </video>
        </section>

        <section class="bloco-mapa">
            <h2>Localização do IFF Campus Campos Centro</h2>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3705.518176527263!2d-41.3259972!3d-21.7599386!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9b85c13b2c2efd%3A0xc3cfad1401309f4b!2sInstituto%20Federal%20Fluminense%20-%20Campus%20Campos%20Centro!5e0!3m2!1spt-BR!2sbr!4v1710000000000!5m2!1spt-BR!2sbr" 
                width="100%" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade"
                title="Mapa com a localização do Instituto Federal Fluminense Campus Campos Centro"
                sandbox="allow-scripts allow-same-origin allow-popups">
            </iframe>
        </section>
    </main>

</body>
</html>
